<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Документы</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card">
        <div class="card-body">
            <h1 class="card-title">Документы</h1>

            <form th:action="@{/documents}" method="get" class="mb-4">
                <div class="input-group">
                    <input type="text" class="form-control" name="query" th:value="${query}" placeholder="Поиск по названию">
                    <button type="submit" class="btn btn-primary">Поиск</button>
                    <a th:href="@{/documents}" class="btn btn-outline-secondary">Сброс</a>
                </div>
            </form>

            <form id="upload-form" enctype="multipart/form-data" class="mb-4">
                <div class="input-group">
                    <input type="file" name="file" class="form-control" accept=".pdf" required>
                    <button id="upload-btn" class="btn btn-success" type="submit">Загрузить</button>
                </div>
            </form>

            <div id="progress-container" class="my-3 d-none">
                <div class="progress">
                    <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated"
                         style="width: 0%">0%</div>
                </div>
                <p id="progress-text" class="mt-2 text-center" style="font-size: 0.8125rem; color: #8b949e;">Начинаем обработку...</p>
                <button id="cancelProcessBtn" class="btn btn-warning mt-2" onclick="cancelProcess()">Отменить обработку</button>
            </div>

            <div style="overflow-x: auto;">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Название</th>
                        <th>Количество чанков</th>
                        <th class="text-end">Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="doc : ${documents}">
                        <td th:text="${doc['filename']}" style="color: #c9d1d9; font-weight: 500;"></td>
                        <td th:text="${doc['cnt']}" style="color: #8b949e;"></td>
                        <td class="text-end">
                            <button id="remove-btn" class="btn btn-danger"
                                    th:attr="data-filename=${doc['filename']}"
                                    onclick="deleteDocument(this)">
                                Удалить
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${documents.isEmpty()}">
                        <td colspan="3" class="text-center text-muted" style="padding: 2rem;">Нет загруженных документов</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
